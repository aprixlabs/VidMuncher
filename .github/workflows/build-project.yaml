name: Build Project
on:
  workflow_call:
    outputs:
      appName:
        description: Project name
        value: ${{ jobs.check-event.outputs.appName }}
      appVersion:
        description: Project version
        value: ${{ jobs.check-event.outputs.appVersion }}
      commitHash:
        description: Short commit hash
        value: ${{ jobs.check-event.outputs.commitHash }}

jobs:
  check-event:
    name: Check GitHub Event Data 🔎
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    outputs:
      appName: ${{ steps.setup.outputs.appName }}
      appVersion: ${{ steps.setup.outputs.appVersion }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse App Info ☑️
        id: setup
        run: |
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          app_name=$(grep 'APP_NAME' src/app/config/app_info.py | sed -E 's/^.+APP_NAME\s*=\s*"([^"]+)".*$/\1/')
          app_version=$(grep 'APP_VERSION' src/app/config/app_info.py | sed -E 's/^.+APP_VERSION\s*=\s*"([^"]+)".*$/\1/')

          echo "appName=${app_name:-VidMuncher}" >> $GITHUB_OUTPUT
          echo "appVersion=${app_version:-1.0.0}" >> $GITHUB_OUTPUT
          echo "commitHash=${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

  windows-build:
    name: Build for Windows 🪟
    runs-on: windows-2022
    needs: check-event
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Set Up Python 🔧
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable 🧱
        run: cmd /c "packaging\windows\build_windows.bat"

      - name: Install Inno Setup 💿
        run: choco install innosetup --yes

      - name: Package Installer 📀
        run: cmd /c "packaging\windows\build_installer.bat"

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check-event.outputs.appName }}-${{ needs.check-event.outputs.appVersion }}-windows-x64-${{ needs.check-event.outputs.commitHash }}
          path: |
            dist/windows/*.exe
            dist/windows/*.zip

  linux-deb:
    name: Build for Debian 🐧
    runs-on: ubuntu-latest
    needs: check-event
    steps:
      - uses: actions/checkout@v4
      - name: Set Up Python 🔧
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils patchelf libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build DEB 🧱
        run: |
          chmod +x packaging/linux/build_deb.sh
          ./packaging/linux/build_deb.sh

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check-event.outputs.appName }}-${{ needs.check-event.outputs.appVersion }}-linux-deb-${{ needs.check-event.outputs.commitHash }}
          path: dist/linux/*.deb

  linux-rpm:
    name: Build for Fedora 🎩
    runs-on: ubuntu-latest
    container: fedora:latest
    needs: check-event
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies 🔧
        run: |
          dnf update -y
          dnf install -y python3 python3-pip rpm-build gcc make libglvnd-glx libglvnd-egl libxkbcommon dbus-libs fontconfig glib2
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyinstaller

      - name: Build RPM 🧱
        run: |
          chmod +x packaging/linux/build_rpm.sh
          ./packaging/linux/build_rpm.sh

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check-event.outputs.appName }}-${{ needs.check-event.outputs.appVersion }}-linux-rpm-${{ needs.check-event.outputs.commitHash }}
          path: dist/linux/*.rpm

  linux-arch:
    name: Build for Arch 🧲
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    needs: check-event
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies 🔧
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm python python-pip pyinstaller gcc mesa libxkbcommon dbus fontconfig glib2
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages

      - name: Build Arch 🧱
        run: |
          chmod +x packaging/linux/build_arch.sh
          ./packaging/linux/build_arch.sh

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check-event.outputs.appName }}-${{ needs.check-event.outputs.appVersion }}-linux-arch-${{ needs.check-event.outputs.commitHash }}
          path: dist/linux/*.tar.zst
