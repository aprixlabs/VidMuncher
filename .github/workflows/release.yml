name: Build and Release VidMuncher

on:
  push:
    tags:
      - 'v*' # Trigger workflow only on tags matching v*, e.g. v1.1.1
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          cmd /c "packaging\windows\build_windows.bat"

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Build Inno Setup Installer
        run: |
          cmd /c "packaging\windows\build_installer.bat"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/windows/VidMuncher/VidMuncher.exe
            dist/windows/VidMuncher-Setup-*.exe

  build-linux-deb:
    name: Build Linux DEB (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils patchelf libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build DEB Package
        run: |
          chmod +x packaging/linux/build_deb.sh
          ./packaging/linux/build_deb.sh

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/linux/*.deb

  build-linux-rpm:
    name: Build Linux RPM (Fedora)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          dnf update -y
          dnf install -y python3 python3-pip rpm-build gcc make libglvnd-glx libglvnd-egl libxkbcommon dbus-libs fontconfig glib2

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyinstaller

      - name: Build RPM Package
        run: |
          chmod +x packaging/linux/build_rpm.sh
          ./packaging/linux/build_rpm.sh

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/linux/*.rpm

  build-linux-arch:
    name: Build Linux Arch
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm python python-pip pyinstaller gcc mesa libxkbcommon dbus fontconfig glib2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages

      - name: Build Arch Linux (tar.gz)
        run: |
          chmod +x packaging/linux/build_arch.sh
          ./packaging/linux/build_arch.sh

      - name: Upload Arch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arch
          path: dist/linux/*.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux-deb, build-linux-rpm, build-linux-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-assets/windows

      - name: Download Linux DEB Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: release-assets/linux

      - name: Download Linux RPM Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-rpm
          path: release-assets/linux

      - name: Download Linux Arch Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-arch
          path: release-assets/linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows/*
            release-assets/linux/*
          draft: false
          prerelease: false
          generate_release_notes: true
